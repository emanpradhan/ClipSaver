<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Download videos and audio in your preferred format and quality.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e9e7f5">
<title>DD</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

<script>
/* Apply the saved theme before first paint; fall back to the system setting. */
try {
  const saved = localStorage.getItem("cs_theme");
  const system = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = saved || system;
} catch (error) {}
</script>

<style>
:root {
  --bg: #e9e7f5;
  --card: #f7f6fc;
  --soft: #e0def0;
  --line: #c5c4df;
  --text: #4e5288;
  --muted: #6b6f9c;
  --accent: #55598f;
  --accent-hover: #414675;
  --accent-soft: rgba(85,89,143,.16);
  --success: #667c72;
  --danger: #b65370;
  --shadow: 0 10px 30px rgba(57,52,105,.10);
  --radius: 18px;
}

[data-theme="dark"] {
  --bg: #171728;
  --card: #23243b;
  --soft: #30314d;
  --line: #464767;
  --text: #f1effb;
  --muted: #b9b8d7;
  --accent: #a7a8dc;
  --accent-hover: #c4c3ed;
  --accent-soft: rgba(167,168,220,.18);
  --success: #a6c8b8;
  --danger: #f39bb2;
  --shadow: 0 12px 32px rgba(0,0,0,.22);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font: 400 15px/1.6 Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background .2s, color .2s;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 0%, var(--accent-soft), transparent 65%),
    linear-gradient(135deg, rgba(255,255,255,.12), transparent 60%);
}

button, input, select {
  font: inherit;
  color: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}

svg {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.wrap {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 24px;
}

/* HEADER */

header {
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(16px);
}

.nav {
  min-height: 76px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.logo {
  display: block;
  width: 62px;
  height: 48px;
}

/* The logo follows the theme accent so it stays visible in dark mode. */
.logo g { fill: var(--accent); }
.logo .swoosh { stroke: var(--accent); }

.theme-toggle {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 30px;
  background: var(--card);
  cursor: pointer;
}

.theme-toggle span {
  width: 35px;
  height: 35px;
  display: grid;
  place-items: center;
  border-radius: 50%;
}

.theme-toggle .active {
  color: #fff;
  background: var(--accent);
}

[data-theme="dark"] .theme-toggle .active {
  color: #171728;
}

/* HERO */

main {
  flex: 1;
  padding-top: 72px;
  padding-bottom: 64px;
}

.hero {
  text-align: center;
  margin-bottom: 36px;
}

h1 {
  margin: 0 0 18px;
  font-family: "Bodoni Moda", Didot, "Bodoni MT", serif;
  font-size: clamp(2.7rem, 8vw, 6rem);
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: -.065em;
  text-transform: uppercase;
  color: var(--text);
}

.hero p {
  max-width: 600px;
  margin: 0 auto;
  font-size: clamp(.95rem, 2vw, 1.15rem);
  color: var(--muted);
}

/* COMMON CARDS */

.card {
  border: 1px solid rgba(255,255,255,.8);
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow);
}

[data-theme="dark"] .card {
  border-color: var(--line);
}

.search-card {
  padding: 12px;
}

.url-field {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 8px 8px 18px;
  border: 1px solid var(--line);
  border-radius: 50px;
  background: var(--bg);
  transition: .2s;
}

.url-field:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}

.url-field.invalid {
  border-color: var(--danger);
}

.url-field > svg {
  color: var(--muted);
}

.url-field input {
  flex: 1;
  min-width: 0;
  padding: 12px 0;
  border: 0;
  outline: none;
  background: transparent;
  font-size: 1rem;
}

.url-field input::placeholder {
  color: var(--muted);
}

.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 9px;
  padding: 12px 20px;
  border: 1px solid var(--line);
  border-radius: 30px;
  background: var(--card);
  font-weight: 600;
  cursor: pointer;
  transition: .2s;
}

.btn:hover:not(:disabled) {
  transform: translateY(-1px);
}

.btn:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.btn-primary {
  border-color: transparent;
  background: var(--accent);
  color: #fff;
}

[data-theme="dark"] .btn-primary {
  color: #171728;
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
}

.btn-secondary {
  color: var(--text);
}

.btn-quiet {
  padding: 8px;
  border: 0;
  background: transparent;
  color: var(--muted);
}

.hint {
  min-height: 22px;
  margin: 9px 10px 0;
  color: var(--muted);
  font-size: .82rem;
}

.hint.error {
  color: var(--danger);
}

/* TRUST LABELS */

.trust {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px 26px;
  margin: 24px 0 36px;
  color: var(--muted);
  font-size: .9rem;
}

.trust span {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* VIDEO DETAILS */

.panel {
  display: none;
  margin-top: 30px;
  overflow: hidden;
}

.panel.show {
  display: block;
  animation: rise .25s ease;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.panel-body {
  display: grid;
  gap: 24px;
  padding: 24px;
}

.video-meta {
  display: grid;
  grid-template-columns: minmax(220px, .9fr) 1.1fr;
  gap: 24px;
}

.thumbnail {
  position: relative;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--soft);
}

/* Shimmer while the thumbnail is still loading */
.thumbnail.empty::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
  transform: translateX(-100%);
  animation: shimmer 1.4s ease-in-out infinite;
}

@keyframes shimmer {
  to { transform: translateX(100%); }
}

.thumbnail img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.thumbnail.empty img {
  display: none;
}

.duration {
  position: absolute;
  right: 10px;
  bottom: 10px;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(20,20,35,.85);
  color: white;
  font-size: .75rem;
}

.video-info h2 {
  margin: 8px 0;
  font-size: 1.2rem;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.video-by {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  color: var(--muted);
  font-size: .85rem;
}

.section-label {
  display: block;
  margin-bottom: 8px;
  color: var(--muted);
  font-size: .82rem;
  font-weight: 600;
}

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.panel.loading .options,
.panel.loading .checkbox {
  opacity: .55;
  pointer-events: none;
}

.segmented {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--soft);
}

.segmented button {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 12px 8px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font-weight: 600;
  cursor: pointer;
}

.segmented button:disabled {
  cursor: not-allowed;
  opacity: .6;
}

.segmented button[aria-pressed="true"] {
  background: var(--card);
  color: var(--accent);
  box-shadow: 0 2px 8px rgba(40,40,80,.08);
}

select {
  width: 100%;
  min-height: 48px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  cursor: pointer;
}

select:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.note {
  margin: 8px 2px 0;
  color: var(--muted);
  font-size: .78rem;
}

.checkbox {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: .9rem;
  cursor: pointer;
}

.checkbox input {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
}

/* PROGRESS */

.progress {
  display: none;
}

.progress.show {
  display: block;
}

.progress-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
  color: var(--muted);
  font-size: .85rem;
}

.track {
  height: 8px;
  overflow: hidden;
  border-radius: 20px;
  background: var(--soft);
}

.fill {
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: var(--accent);
  transition: width .2s;
}

.fill.indeterminate {
  width: 38%;
  animation: slide 1.3s ease-in-out infinite;
}

@keyframes slide {
  from { transform: translateX(-100%); }
  to { transform: translateX(300%); }
}

.download-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
}

.download-row .btn {
  min-height: 50px;
}

/* HISTORY */

.history-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 46px 0 14px;
}

.history-heading h2 {
  margin: 0;
  font-family: "Bodoni Moda", Didot, serif;
  font-size: 1.5rem;
  font-weight: 500;
}

.history {
  display: grid;
  gap: 10px;
}

.history-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--card);
}

.history-title {
  flex: 1;
  min-width: 0;
}

.history-title strong {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: .9rem;
}

.history-title small {
  color: var(--muted);
}

.empty {
  padding: 26px;
  border: 1px dashed var(--line);
  border-radius: 13px;
  color: var(--muted);
  text-align: center;
}

.tag {
  display: inline-block;
  margin-right: 8px;
  padding: 2px 7px;
  border: 1px solid var(--line);
  border-radius: 5px;
  font-size: .7rem;
}

/* FOOTER AND NOTIFICATIONS */

footer {
  border-top: 1px solid var(--line);
  padding: 24px 0;
  color: var(--muted);
  font-size: .8rem;
}

.footer-inner {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 12px 24px;
}

#toasts {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 50;
  display: grid;
  gap: 10px;
  max-width: calc(100vw - 36px);
}

.toast {
  padding: 13px 18px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--card);
  box-shadow: var(--shadow);
  animation: rise .2s ease;
}

.toast.error {
  border-color: var(--danger);
  color: var(--danger);
}

[hidden] {
  display: none !important;
}

@media (min-width: 1200px) {
  main {
    padding-top: 90px;
  }
}

@media (max-width: 650px) {
  .wrap {
    padding-right: 16px;
    padding-left: 16px;
  }

  main {
    padding-top: 48px;
  }

  h1 {
    font-size: clamp(2.4rem, 12vw, 4rem);
    letter-spacing: -.06em;
  }

  .hero {
    margin-bottom: 28px;
  }

  .url-field {
    flex-wrap: wrap;
    border-radius: 20px;
    padding: 12px;
  }

  .url-field > svg {
    display: none;
  }

  .url-field input {
    flex-basis: calc(100% - 10px);
    order: -1;
    padding: 8px 4px;
  }

  .url-field .btn {
    flex: 1;
    padding: 11px 12px;
  }

  .trust {
    gap: 12px 18px;
  }

  .video-meta,
  .options {
    grid-template-columns: 1fr;
  }

  .panel-body {
    padding: 16px;
  }

  .download-row {
    grid-template-columns: 1fr;
  }

  .history-item {
    gap: 6px;
    padding: 10px;
  }

  .footer-inner {
    flex-direction: column;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<header>
  <div class="wrap nav">
    <button class="brand" id="home" type="button" aria-label="Home">
      <svg class="logo" viewBox="0 0 100 75" role="img" aria-label="DD">
        <g>
          <path d="M8 8 H37 C58 8 70 19 70 37 C70 56 57 66 37 66 H8 V55 H17 V19 H8 Z M29 19 V55 H36 C49 55 57 49 57 37 C57 25 49 19 36 19 Z"/>
          <path d="M39 8 H64 C84 8 94 19 94 37 C94 56 81 66 61 66 H39 L47 55 H61 C74 55 82 49 82 37 C82 25 74 19 61 19 H47 V37 H39 Z"/>
        </g>
        <path class="swoosh" d="M5 53 C25 73 69 45 90 18 C99 5 81 2 68 10" fill="none" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </button>

    <button class="theme-toggle" id="theme" type="button" aria-label="Dark mode" aria-pressed="false">
      <span id="sunIcon" aria-hidden="true">☼</span>
      <span id="moonIcon" aria-hidden="true">☾</span>
    </button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Downloader</h1>
    <p>Paste a YouTube link and download your favorite video or audio.</p>
  </section>

  <section class="card search-card">
    <div class="url-field" id="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/>
        <path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/>
      </svg>

      <label for="url" class="sr-only">YouTube URL</label>
      <input id="url" type="url" inputmode="url" autocapitalize="none" placeholder="Paste YouTube URL here..." autocomplete="off" spellcheck="false">

      <button class="btn btn-quiet" id="clear" type="button" aria-label="Clear URL" hidden>×</button>
      <button class="btn btn-secondary" id="paste" type="button">Paste</button>
      <button class="btn btn-primary" id="fetch" type="button">Get clip</button>
    </div>

    <div class="hint" id="hint" role="status" aria-live="polite">
      Supports youtube.com and youtu.be links.
    </div>
  </section>

  <div class="trust">
    <span>◇ Fast</span>
    <span>✓ Secure</span>
    <span>∞ Free</span>
  </div>

  <section class="card panel" id="panel" aria-label="Video details" aria-busy="false">
    <div class="panel-body">
      <div class="video-meta">
        <div class="thumbnail empty" id="thumbBox">
          <img id="thumb" alt="" referrerpolicy="no-referrer">
          <span class="duration" id="dur" hidden></span>
        </div>

        <div class="video-info">
          <div class="video-by">
            <span id="chan"></span>
            <span id="views"></span>
          </div>
          <h2 id="vtitle">Video title</h2>
        </div>
      </div>

      <div class="options">
        <div>
          <span class="section-label" id="fl">Format</span>
          <div class="segmented" role="group" aria-labelledby="fl">
            <button type="button" id="fV" aria-pressed="true">▣ MP4 Video</button>
            <button type="button" id="fA" aria-pressed="false">♫ MP3 Audio</button>
          </div>
        </div>

        <div>
          <label class="section-label" for="quality" id="ql">Resolution</label>
          <select id="quality">
            <option value="">Recommended</option>
          </select>
          <p class="note" id="qnote" hidden></p>
        </div>
      </div>

      <label class="checkbox" id="subWrap">
        <input type="checkbox" id="subs">
        Include English subtitles (.srt, saved as a zip)
      </label>

      <div class="progress" id="prog" aria-live="polite">
        <div class="progress-row">
          <span id="pl">Starting...</span>
          <span id="pp"></span>
        </div>
        <div class="track">
          <div class="fill" id="fill"></div>
        </div>
      </div>

      <div class="download-row">
        <button class="btn btn-primary" id="download" type="button" disabled>
          ↓ <span id="dlt">Download</span>
        </button>
        <button class="btn btn-secondary" id="cancel" type="button" hidden>
          Cancel
        </button>
      </div>
    </div>
  </section>

  <section>
    <div class="history-heading">
      <h2>Recent clips</h2>
      <button class="btn btn-quiet" id="clearHist" type="button" hidden>Clear all</button>
    </div>
    <div class="history" id="hist"></div>
  </section>
</main>

<footer>
  <div class="wrap footer-inner">
    <span>© DD Downloader</span>
    <span>Only download content you own or have permission to save.</span>
  </div>
</footer>

<div id="toasts" aria-live="polite"></div>

<script>
"use strict";

/* DOM helpers and application state */

const $ = id => document.getElementById(id);

const YT = /^https?:\/\/(www\.|m\.|music\.)?(youtube\.com|youtu\.be)\//i;
const DEFAULT_HINT = "Supports youtube.com and youtu.be links.";

const S = {
  kind: "video",
  info: null,      // full video info (with available heights)
  loading: false,  // a lookup is in flight
  busy: false      // a download job is in flight
};

const ls = {
  get(key) {
    try { return localStorage.getItem(key); } catch { return null; }
  },
  set(key, value) {
    try { localStorage.setItem(key, value); } catch {}
  },
  del(key) {
    try { localStorage.removeItem(key); } catch {}
  }
};

let sequence = 0;
let jobId = null;
let cancelRequested = false;
let activeController = null;

const url = $("url");

/* Theme */

function paintTheme() {
  const dark = document.documentElement.dataset.theme === "dark";
  $("sunIcon").classList.toggle("active", !dark);
  $("moonIcon").classList.toggle("active", dark);
  $("theme").setAttribute("aria-pressed", String(dark));
  document.querySelector('meta[name="theme-color"]')
    .setAttribute("content", dark ? "#171728" : "#e9e7f5");
}

paintTheme();

$("theme").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  ls.set("cs_theme", next);
  paintTheme();
});

/* Notifications and helpers */

function toast(message, error = false) {
  const element = document.createElement("div");
  element.className = "toast" + (error ? " error" : "");
  element.textContent = message;
  $("toasts").append(element);
  setTimeout(() => element.remove(), 4000);
}

function hint(message, error = false) {
  $("hint").textContent = message;
  $("hint").classList.toggle("error", error);
  $("field").classList.toggle("invalid", error);
}

function fmtDur(seconds) {
  if (!seconds) return "";
  seconds = Math.round(seconds);

  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;

  return (h ? h + ":" + String(m).padStart(2, "0") : m)
    + ":" + String(s).padStart(2, "0");
}

function post(path, body, signal) {
  return fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
    signal
  });
}

async function errorMessage(response) {
  try {
    const data = await response.json();
    return data.error || "Request failed.";
  } catch {
    return "Something went wrong (" + response.status + ").";
  }
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function fmtSpeed(bytesPerSecond) {
  return bytesPerSecond ? (bytesPerSecond / 1048576).toFixed(1) + " MB/s" : "";
}

function fmtEta(seconds) {
  if (seconds == null) return "";

  return seconds >= 60
    ? Math.floor(seconds / 60) + "m " + Math.round(seconds % 60) + "s left"
    : Math.round(seconds) + "s left";
}

function downloadLabel(kind, height, bitrate) {
  return kind === "audio"
    ? "MP3 " + bitrate + "k"
    : height
      ? (height >= 2160 ? "4K" : height + "p")
      : "Best";
}

/* Keep every control's enabled state in one place */

function updateControls() {
  const ready = !!S.info && !S.loading;

  $("fetch").disabled = S.busy || S.loading;
  $("download").disabled = S.busy || !ready;
  $("cancel").hidden = !S.busy;

  ["fV", "fA"].forEach(id => { $(id).disabled = S.busy; });
  $("quality").disabled = S.busy || !ready;
  $("subs").disabled = S.busy || !ready;

  $("panel").classList.toggle("loading", S.loading);
  $("panel").setAttribute("aria-busy", String(S.loading));
  $("dlt").textContent = S.busy ? "Working..." : "Download";
}

/* URL input */

url.addEventListener("input", () => {
  $("clear").hidden = !url.value;
  hint(DEFAULT_HINT);
});

url.addEventListener("keydown", event => {
  if (event.key === "Enter") lookup();
});

url.addEventListener("paste", () => {
  setTimeout(() => {
    if (YT.test(url.value.trim())) lookup();
  }, 100);
});

$("clear").addEventListener("click", () => {
  url.value = "";
  $("clear").hidden = true;
  hint(DEFAULT_HINT);
  url.focus();
});

$("paste").addEventListener("click", async () => {
  try {
    url.value = (await navigator.clipboard.readText()).trim();
    $("clear").hidden = !url.value;

    if (YT.test(url.value)) lookup();
    else hint("That doesn't look like a YouTube link.", true);
  } catch {
    toast("Clipboard access is blocked. Press Ctrl+V instead.", true);
  }
});

$("home").addEventListener("click", () => {
  if (S.busy) return;

  sequence++;
  if (activeController) activeController.abort();
  S.loading = false;
  S.info = null;

  url.value = "";
  $("clear").hidden = true;
  $("panel").classList.remove("show");
  $("prog").classList.remove("show");
  updateControls();

  hint(DEFAULT_HINT);
  window.scrollTo({ top: 0, behavior: "smooth" });
});

/* Video lookup */

function resetPanel() {
  $("thumbBox").classList.add("empty");
  $("thumb").removeAttribute("src");
  $("vtitle").textContent = "Loading video...";
  $("chan").textContent = "";
  $("views").textContent = "";
  $("dur").hidden = true;
  $("prog").classList.remove("show");
}

function renderVideo(data) {
  if (data.thumbnail) {
    $("thumb").src = data.thumbnail;
    $("thumbBox").classList.remove("empty");
  }

  $("vtitle").textContent = data.title || "Untitled";
  $("chan").textContent = data.channel || "";

  $("dur").textContent = fmtDur(data.duration);
  $("dur").hidden = !data.duration;

  $("views").textContent = data.views
    ? "· " + new Intl.NumberFormat("en", { notation: "compact" }).format(data.views) + " views"
    : "";
}

async function lookup() {
  const input = url.value.trim();

  if (S.busy) {
    hint("Wait for the current download to finish first.", true);
    return;
  }

  if (!input) {
    hint("Paste a YouTube link first.", true);
    return;
  }

  if (!YT.test(input)) {
    hint("That doesn't look like a YouTube link.", true);
    return;
  }

  // A new lookup replaces any lookup still in flight.
  if (activeController) activeController.abort();
  const controller = new AbortController();
  activeController = controller;
  const requestId = ++sequence;

  S.loading = true;
  S.info = null;
  resetPanel();
  setKind(S.kind);
  $("panel").classList.add("show");
  $("fetch").textContent = "Loading...";
  updateControls();
  hint("Getting video information...");

  const fullRequest = post("/api/info", { url: input }, controller.signal)
    .then(async response => {
      if (!response.ok) throw new Error(await errorMessage(response));
      return response.json();
    });

  // Avoids an "unhandled rejection" warning if this fails while we await the preview.
  fullRequest.catch(() => {});

  const previewRequest = post("/api/preview", { url: input }, controller.signal)
    .then(response => response.ok ? response.json() : null)
    .catch(() => null);

  try {
    const preview = await previewRequest;
    if (requestId !== sequence) return;

    if (preview) {
      renderVideo(preview);
      hint("Loading available qualities...");
    }

    const data = await fullRequest;
    if (requestId !== sequence) return;

    S.info = data;
    renderVideo(data);
    setKind(S.kind);
    hint("Ready. Choose a format and quality.");

  } catch (error) {
    if (requestId !== sequence) return;

    S.info = null;
    $("panel").classList.remove("show");
    hint(error.name === "AbortError" ? "Request cancelled." : error.message, true);

  } finally {
    if (requestId === sequence) {
      S.loading = false;
      $("fetch").textContent = "Get clip";
      updateControls();
    }
  }
}

$("fetch").addEventListener("click", lookup);

/* Format and quality */

function updateQualityNote() {
  const note = $("qnote");
  const height = Number($("quality").value) || 0;

  if (S.kind === "video" && height > 1080) {
    note.textContent = "Above 1080p the video uses VP9/AV1, which some players can't open. Choose 1080p for the widest compatibility.";
    note.hidden = false;
  } else {
    note.hidden = true;
  }
}

function setKind(kind) {
  S.kind = kind;

  $("fV").setAttribute("aria-pressed", String(kind === "video"));
  $("fA").setAttribute("aria-pressed", String(kind === "audio"));

  const select = $("quality");
  const previous = select.value;
  select.replaceChildren();

  function addOption(value, label) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = label;
    select.append(option);
  }

  if (kind === "audio") {
    $("ql").textContent = "Audio bitrate";

    [
      ["320", "320 kbps — High"],
      ["256", "256 kbps"],
      ["192", "192 kbps — Standard"],
      ["128", "128 kbps — Compact"]
    ].forEach(option => addOption(...option));

    select.value = "192";

  } else {
    $("ql").textContent = "Video resolution";

    addOption("", "Recommended (up to 1080p)");

    const heights = S.info?.heights || [];

    [...new Set(heights)]
      .filter(height => height >= 360)
      .sort((a, b) => b - a)
      .forEach(height => {
        let prefix = "";

        if (height >= 2160) prefix = "4K · ";
        else if (height >= 1440) prefix = "2K · ";
        else if (height >= 1080) prefix = "Full HD · ";
        else if (height >= 720) prefix = "HD · ";

        addOption(String(height), prefix + height + "p");
      });

    // Keep the person's choice when the quality list refreshes.
    if ([...select.options].some(option => option.value === previous)) {
      select.value = previous;
    }
  }

  $("subWrap").hidden = kind === "audio";
  updateQualityNote();
}

$("fV").addEventListener("click", () => setKind("video"));
$("fA").addEventListener("click", () => setKind("audio"));
$("quality").addEventListener("change", updateQualityNote);

/* Download progress */

function showProgress(message, percent) {
  $("prog").classList.add("show");
  $("pl").textContent = message;

  const fill = $("fill");

  if (percent == null) {
    fill.classList.add("indeterminate");
    fill.style.width = "";
    $("pp").textContent = "";
  } else {
    fill.classList.remove("indeterminate");
    fill.style.width = percent + "%";
    $("pp").textContent = Math.floor(percent) + "%";
  }
}

function setBusy(busy) {
  S.busy = busy;
  updateControls();
}

/* Cancel download */

function sendCancel(id) {
  return fetch("/api/cancel/" + encodeURIComponent(id), { method: "POST" });
}

$("cancel").addEventListener("click", async () => {
  cancelRequested = true;
  $("cancel").disabled = true;
  showProgress("Cancelling...", null);

  // If the job id has not arrived yet, the start handler cancels it as soon as it does.
  if (jobId == null) return;

  try {
    await sendCancel(jobId);
  } catch {
    toast("Could not contact the server to cancel.", true);
  }
});

/* If the person closes the tab mid-download, free the server slot. */
window.addEventListener("pagehide", () => {
  if (S.busy && jobId != null && navigator.sendBeacon) {
    navigator.sendBeacon("/api/cancel/" + encodeURIComponent(jobId));
  }
});

window.addEventListener("beforeunload", event => {
  if (S.busy) {
    event.preventDefault();
    event.returnValue = "";
  }
});

/* Start download */

$("download").addEventListener("click", async () => {
  if (S.busy || !S.info) {
    if (!S.info) hint("Get the video information first.", true);
    return;
  }

  const selectedQuality = $("quality").value;

  const body = {
    url: url.value.trim(),
    kind: S.kind,
    height: S.kind === "video" ? (selectedQuality || null) : null,
    abr: S.kind === "audio" ? selectedQuality : "192",
    subtitles: S.kind === "video" && $("subs").checked
  };

  cancelRequested = false;
  setBusy(true);
  showProgress("Starting download...", 0);

  let cancelled = false;

  try {
    const response = await post("/api/start", body);

    if (!response.ok) {
      throw new Error(await errorMessage(response));
    }

    const result = await response.json();
    jobId = result.id;

    if (jobId == null) {
      throw new Error("The server did not return a download job ID.");
    }

    if (cancelRequested) {
      try { await sendCancel(jobId); } catch {}
    }

    let status;
    let failures = 0;

    while (true) {
      let poll;

      try {
        poll = await fetch("/api/status/" + encodeURIComponent(jobId));
        failures = 0;
      } catch {
        if (++failures > 5) {
          throw new Error("Lost connection to the server.");
        }
        await sleep(1000);
        continue;
      }

      if (!poll.ok) {
        throw new Error(await errorMessage(poll));
      }

      status = await poll.json();

      if (status.status === "error") {
        throw new Error(status.error || "Download failed.");
      }

      if (status.status === "cancelled") {
        cancelled = true;
        throw new Error("Download cancelled.");
      }

      if (status.status === "ready") break;

      if (status.status === "queued") {
        showProgress("Waiting for a free slot...", null);

      } else if (status.stage === "downloading") {
        const extra = [fmtSpeed(status.speed), fmtEta(status.eta)]
          .filter(Boolean)
          .join(" · ");

        showProgress("Downloading" + (extra ? " · " + extra : "..."), status.pct);

      } else if (status.stage === "processing") {
        showProgress("Converting and merging...", null);

      } else {
        showProgress("Preparing download...", null);
      }

      await sleep(500);
    }

    showProgress("Download ready", 100);

    const fileLink = document.createElement("a");
    fileLink.href = "/api/file/" + encodeURIComponent(jobId);
    fileLink.download = "";
    document.body.append(fileLink);
    fileLink.click();
    fileLink.remove();

    toast("Download started. Check your downloads folder.");

    addHistory({
      title: S.info.title || "Downloaded video",
      url: body.url,
      label: downloadLabel(S.kind, Number(body.height) || null, body.abr),
      at: Date.now()
    });

  } catch (error) {
    $("prog").classList.remove("show");
    // A cancellation the person asked for is not an error.
    toast(error.message || "Download failed.", !cancelled);

  } finally {
    setBusy(false);
    jobId = null;
    cancelRequested = false;
    $("cancel").disabled = false;
  }
});

/* Recent download history */

function getHistory() {
  try {
    const list = JSON.parse(ls.get("cs_history") || "[]");
    return Array.isArray(list) ? list : [];
  } catch {
    return [];
  }
}

function addHistory(item) {
  const history = getHistory().filter(old =>
    !(old.url === item.url && old.label === item.label)
  );

  history.unshift(item);
  ls.set("cs_history", JSON.stringify(history.slice(0, 10)));
  renderHistory();
}

function renderHistory() {
  const container = $("hist");
  const history = getHistory();

  container.replaceChildren();
  $("clearHist").hidden = history.length === 0;

  if (!history.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Your recent downloads will appear here.";
    container.append(empty);
    return;
  }

  history.forEach(item => {
    const row = document.createElement("div");
    row.className = "history-item";

    const details = document.createElement("div");
    details.className = "history-title";

    const title = document.createElement("strong");
    title.textContent = item.title;
    title.title = item.title;

    const small = document.createElement("small");
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = item.label;

    small.append(
      tag,
      document.createTextNode(
        new Date(item.at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })
      )
    );

    details.append(title, small);

    const again = document.createElement("button");
    again.className = "btn btn-quiet";
    again.type = "button";
    again.textContent = "↻";
    again.title = "Load this link again";
    again.setAttribute("aria-label", "Load this link again");

    again.addEventListener("click", () => {
      url.value = item.url;
      $("clear").hidden = false;
      window.scrollTo({ top: 0, behavior: "smooth" });
      lookup();
    });

    const copy = document.createElement("button");
    copy.className = "btn btn-quiet";
    copy.type = "button";
    copy.textContent = "⧉";
    copy.title = "Copy URL";
    copy.setAttribute("aria-label", "Copy URL");

    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(item.url);
        toast("URL copied.");
      } catch {
        toast("Could not copy the URL.", true);
      }
    });

    row.append(details, again, copy);
    container.append(row);
  });
}

$("clearHist").addEventListener("click", () => {
  ls.del("cs_history");
  renderHistory();
  toast("History cleared.");
});

renderHistory();
updateControls();

/* Load a URL from ?url=... */

const initialURL = new URLSearchParams(location.search).get("url");

if (initialURL) {
  url.value = initialURL;
  $("clear").hidden = false;
  lookup();
}
</script>
</body>
</html>
